<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Machine-learning workflow from training through inference</title>
  <desc id="desc">A three-step overview of training with a training dataset, validation with a validation dataset, and testing plus inference. The notebook focuses on making an inference with a fixed model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .title { font-family: Georgia, serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .label { font-family: Georgia, serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .small { font-family: Georgia, serif; font-size: 14px; fill: #ffffff; }
      .ink { font-family: Georgia, serif; font-size: 17px; font-weight: 700; fill: #111111; }
      .muted { font-family: Georgia, serif; font-size: 14px; fill: #666666; }
      .cyan { fill: #00b5e2; font-weight: 700; }
      .phase { fill: none; stroke: #222222; stroke-width: 1.4; stroke-dasharray: 8 7; }
      .flow { fill: none; stroke: #111111; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .box { fill: #050505; stroke: #050505; stroke-width: 1.4; }
      .focus { fill: none; stroke: #ef1c88; stroke-width: 3; stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1600" height="680" fill="#ffffff"/>
  <text class="title" x="52" y="48">Machine-learning workflow: training, validation, testing, and inference</text>
  <text class="muted" x="52" y="74">Each dataset has a different job. This notebook uses the final inference path with a fixed, checked model.</text>

  <rect class="phase" x="42" y="110" width="426" height="470" rx="20"/>
  <text class="ink" x="68" y="144">1. Training</text>
  <text class="muted" x="68" y="167">Learn model weights from examples.</text>
  <rect class="box" x="95" y="215" width="168" height="90" rx="18"/>
  <text class="label" x="179" y="249" text-anchor="middle">Training dataset</text>
  <text class="small" x="179" y="275" text-anchor="middle"><tspan class="cyan">features</tspan><tspan> + labels</tspan></text>
  <path class="flow" d="M 270 260 H 326"/>
  <rect class="box" x="334" y="215" width="99" height="90" rx="18"/>
  <text class="label" x="383" y="249" text-anchor="middle">Train</text>
  <text class="small" x="383" y="275" text-anchor="middle">update weights</text>
  <path class="flow" d="M 383 312 V 342"/>
  <circle cx="383" cy="382" r="32" fill="#ef1c88"/>
  <text class="label" x="383" y="378" text-anchor="middle">learn</text>
  <text class="small" x="383" y="400" text-anchor="middle">patterns</text>
  <path class="flow" d="M 383 422 V 432"/>
  <rect class="box" x="298" y="440" width="170" height="78" rx="18"/>
  <text class="label" x="383" y="472" text-anchor="middle">Candidate model</text>
  <text class="small" x="383" y="497" text-anchor="middle">learned weights</text>

  <rect class="phase" x="503" y="110" width="426" height="470" rx="20"/>
  <text class="ink" x="529" y="144">2. Validation</text>
  <text class="muted" x="529" y="167">Choose and check the candidate model.</text>
  <rect class="box" x="552" y="215" width="176" height="90" rx="18"/>
  <text class="label" x="640" y="249" text-anchor="middle">Validation dataset</text>
  <text class="small" x="640" y="275" text-anchor="middle"><tspan class="cyan">features</tspan><tspan> + labels</tspan></text>
  <path class="flow" d="M 735 260 H 785"/>
  <rect class="box" x="793" y="215" width="104" height="90" rx="18"/>
  <text class="label" x="845" y="249" text-anchor="middle">Validate</text>
  <text class="small" x="845" y="275" text-anchor="middle">compare error</text>
  <path class="flow" d="M 845 312 V 432"/>
  <rect class="box" x="760" y="440" width="170" height="78" rx="18"/>
  <text class="label" x="845" y="472" text-anchor="middle">Selected model</text>
  <text class="small" x="845" y="497" text-anchor="middle">fixed configuration</text>
  <text class="muted" x="553" y="518">Validation informs model choices.</text>

  <rect class="focus" x="964" y="102" width="594" height="486" rx="22"/>
  <text class="ink" x="991" y="144">3. Testing and inference</text>
  <text class="muted" x="991" y="167">Test once, then apply the same checked model to a new case.</text>
  <rect class="box" x="1005" y="214" width="155" height="84" rx="18"/>
  <text class="label" x="1082" y="246" text-anchor="middle">Test dataset</text>
  <text class="small" x="1082" y="271" text-anchor="middle"><tspan class="cyan">features</tspan><tspan> + labels</tspan></text>
  <path class="flow" d="M 1167 256 H 1213"/>
  <rect class="box" x="1221" y="214" width="146" height="84" rx="18"/>
  <text class="label" x="1294" y="246" text-anchor="middle">Test model</text>
  <text class="small" x="1294" y="271" text-anchor="middle">final check</text>
  <path class="flow" d="M 1374 256 H 1421"/>
  <rect x="1428" y="215" width="96" height="82" rx="16" fill="#f8f8f8" stroke="#111111" stroke-width="1.4"/>
  <line x1="1445" y1="274" x2="1507" y2="232" stroke="#00b5e2" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="1460" cy="264" r="4" fill="#ef1c88"/><circle cx="1480" cy="250" r="4" fill="#ef1c88"/><circle cx="1498" cy="239" r="4" fill="#ef1c88"/>
  <text class="muted" x="1476" y="320" text-anchor="middle">test error</text>

  <line x1="992" y1="348" x2="1531" y2="348" stroke="#222222" stroke-width="1.2" stroke-dasharray="6 6"/>
  <text class="ink" x="1005" y="383">Notebook focus: inference</text>
  <rect class="box" x="1010" y="414" width="145" height="84" rx="18"/>
  <text class="label" x="1082" y="446" text-anchor="middle">New input</text>
  <text class="small" x="1082" y="471" text-anchor="middle">8 <tspan class="cyan">features</tspan>, no label</text>
  <path class="flow" d="M 1162 456 H 1205"/>
  <rect class="box" x="1213" y="414" width="131" height="84" rx="18"/>
  <text class="label" x="1278" y="446" text-anchor="middle">Preprocess</text>
  <text class="small" x="1278" y="471" text-anchor="middle">same scaling</text>
  <path class="flow" d="M 1351 456 H 1391"/>
  <rect class="box" x="1399" y="414" width="126" height="84" rx="18"/>
  <text class="label" x="1462" y="446" text-anchor="middle">Predict</text>
  <text class="small" x="1462" y="471" text-anchor="middle">house value</text>
  <text class="muted" x="1008" y="543">Weights do not change during inference.</text>
</svg>
