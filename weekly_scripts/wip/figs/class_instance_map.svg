<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Class, instances, and shared attributes. The names and ages match the Person cells in this notebook."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2374a5"/></marker></defs><rect width="1200" height="430" fill="#fff"/><text x="42" y="47" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="27" font-weight="bold">Class, instances, and shared attributes</text><text x="42" y="77" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">The names and ages match the Person cells in this notebook.</text><rect x="55" y="111" width="1090" height="277" rx="20" fill="#fff9fc" stroke="#ef1c88" stroke-width="2"/><text x="80" y="151" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="bold">One Person definition creates two independent objects</text><rect x="83" y="177" width="305" height="161" rx="16" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="101" y="211" text-anchor="start" fill="#2374a5" font-family="Georgia,serif" font-size="18" font-weight="normal">class Person:</text><text x="101" y="241" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="18" font-weight="normal">  species = &#x27;human&#x27;</text><text x="101" y="271" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="18" font-weight="normal">  __init__(name, age)</text><text x="101" y="301" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="18" font-weight="normal">  description()</text><path d="M394 252 L474 207" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M394 252 L474 302" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="480" y="171" width="309" height="86" rx="16" fill="#eaf5fa" stroke="#2374a5" stroke-width="2"/><text x="502" y="205" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">person1 = Amina</text><text x="502" y="235" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="18" font-weight="normal">age: 3 → 4</text><rect x="480" y="277" width="309" height="86" rx="16" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="502" y="311" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">person2 = Kai</text><text x="502" y="341" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="18" font-weight="normal">age: 5 (unchanged)</text><text x="816" y="216" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">Shared class attribute</text><text x="816" y="249" text-anchor="start" fill="#2374a5" font-family="Georgia,serif" font-size="18" font-weight="normal">Person.species</text><text x="816" y="279" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="17" font-weight="normal">changes for both objects</text><text x="816" y="328" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Each age is stored separately.</text></svg>