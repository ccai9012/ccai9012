<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Ask, sample, guide. The prompts shown correspond to the lesson&#x27;s energy, robot story, and sentence-label cells."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2374a5"/></marker></defs><rect width="1200" height="430" fill="#fff"/><text x="42" y="47" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="27" font-weight="bold">Ask, sample, guide</text><text x="42" y="77" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">The prompts shown correspond to the lesson&#x27;s energy, robot story, and sentence-label cells.</text><text x="55" y="121" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="22" font-weight="bold">Three questions asked of one LLM in this notebook</text><rect x="55" y="155" width="330" height="193" rx="14" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="73" y="190" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="bold">Ask</text><rect x="73" y="207" width="293" height="58" rx="9" fill="#eaf5fa" stroke="none" stroke-width="0"/><text x="83" y="241" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">&quot;How can I save energy at home?&quot;</text><text x="73" y="306" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Read the answer; check the advice.</text><rect x="435" y="155" width="330" height="193" rx="14" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="453" y="190" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="bold">Sample</text><rect x="453" y="207" width="293" height="58" rx="9" fill="#eaf5fa" stroke="none" stroke-width="0"/><text x="463" y="241" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">&quot;A robot learning to paint...&quot;</text><text x="453" y="306" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Run it three times at each T.</text><rect x="815" y="155" width="330" height="193" rx="14" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="833" y="190" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="bold">Guide</text><rect x="833" y="207" width="293" height="58" rx="9" fill="#eaf5fa" stroke="none" stroke-width="0"/><text x="843" y="241" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">&quot;Label this SUPPORT / CONCERN&quot;</text><text x="833" y="306" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Add examples; check the label.</text><text x="55" y="388" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Changing temperature and adding examples are different experiments; neither guarantees a true answer.</text></svg>