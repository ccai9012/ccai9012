<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Prediction first; explanation second. SHAP describes the fitted model on chosen rows, not a causal account of housing prices."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2374a5"/></marker></defs><rect width="1200" height="430" fill="#fff"/><text x="42" y="47" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="27" font-weight="bold">Prediction first; explanation second</text><text x="42" y="77" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">SHAP describes the fitted model on chosen rows, not a causal account of housing prices.</text><rect x="43" y="99" width="1114" height="283" rx="23" fill="#fff9fc" stroke="#ef1c88" stroke-width="2.5" stroke-dasharray="9 7"/><text x="68" y="139" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">Train a predictor, then ask two different explanation questions</text><rect x="70" y="185" width="238" height="112" rx="16" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="88" y="222" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">Housing rows</text><text x="88" y="253" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">features + target</text><path d="M312 240 L373 240" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="379" y="185" width="259" height="112" rx="16" fill="#eaf5fa" stroke="#2374a5" stroke-width="2"/><text x="397" y="222" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">Fitted model</text><text x="397" y="253" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">predicts held-out values</text><path d="M642 240 L700 197" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M642 240 L700 286" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="708" y="154" width="385" height="88" rx="16" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="726" y="191" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">Global view</text><text x="726" y="222" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">patterns across selected rows</text><rect x="708" y="270" width="385" height="88" rx="16" fill="#fff" stroke="#2374a5" stroke-width="2"/><text x="726" y="307" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">Local view</text><text x="726" y="338" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">contributions for one prediction</text></svg>