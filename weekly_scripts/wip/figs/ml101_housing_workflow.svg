<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Linear model versus decision tree. Scaling is fitted on training rows for the linear model; the tree uses the unscaled training features."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2374a5"/></marker></defs><rect width="1200" height="430" fill="#fff"/><text x="42" y="47" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="27" font-weight="bold">Linear model versus decision tree</text><text x="42" y="77" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Scaling is fitted on training rows for the linear model; the tree uses the unscaled training features.</text><text x="55" y="119" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">The same split supports two housing-price predictors</text><rect x="55" y="164" width="236" height="191" rx="8" fill="#eaf5fa" stroke="#2374a5" stroke-width="2"/><text x="75" y="199" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="20" font-weight="bold">Housing CSV</text><text x="75" y="236" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="17" font-weight="normal">X: 8 features</text><text x="75" y="266" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="17" font-weight="normal">y: median value</text><text x="75" y="319" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="17" font-weight="normal">80% train / 20% test</text><path d="M296 236 L350 215" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M296 281 L350 314" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="357" y="157" width="384" height="95" rx="8" fill="#fff" stroke="#a8c2d1" stroke-width="2"/><text x="376" y="191" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">Linear regression</text><text x="376" y="222" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">train-only scaling</text><path d="M566 226 L700 178" fill="none" stroke="#2374a5" stroke-width="4"/><rect x="357" y="270" width="384" height="95" rx="8" fill="#fff" stroke="#a8c2d1" stroke-width="2"/><text x="376" y="304" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">Decision tree</text><text x="376" y="335" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">raw training features</text><path d="M565 339 H605 V321 H652 V292 H700" fill="none" stroke="#ef1c88" stroke-width="4"/><path d="M746 211 L829 238" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M746 317 L829 277" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="835" y="164" width="310" height="191" rx="8" fill="#fff9fc" stroke="#ef1c88" stroke-width="2"/><text x="855" y="199" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">Held-out test rows</text><text x="855" y="241" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="18" font-weight="normal">Compare MSE and R²</text><text x="855" y="281" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="17" font-weight="normal">Plot true vs predicted</text><text x="855" y="319" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Inspect individual errors</text><text x="55" y="395" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Line and step shapes illustrate model forms; the notebook reports fitted results.</text></svg>