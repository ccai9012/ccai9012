<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-label="What is a word embedding, and where can bias enter?. Training text shapes word vectors; those vectors can preserve unwanted associations."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2374a5"/></marker></defs><rect width="1200" height="510" fill="#fff"/><text x="42" y="47" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="27" font-weight="bold">What is a word embedding, and where can bias enter?</text><text x="42" y="77" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">Training text shapes word vectors; those vectors can preserve unwanted associations.</text><text x="52" y="122" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="bold">1  An embedding gives each word a learned list of numbers</text><rect x="53" y="145" width="508" height="142" rx="10" fill="#eaf5fa" stroke="#a8c2d1" stroke-width="2"/><text x="77" y="184" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="22" font-weight="bold">doctor</text><text x="175" y="184" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="normal">→  [ 0.2, −0.4, … ]</text><text x="77" y="233" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="22" font-weight="bold">nurse</text><text x="175" y="233" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="normal">→  [ 0.3, −0.3, … ]</text><text x="78" y="266" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="15" font-weight="normal">Numbers are illustrative; real vectors have many dimensions.</text><path d="M569 215 L640 215" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="672" y="164" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">Similar use can yield nearby vectors</text><circle cx="730" cy="217" r="8" fill="#2374a5"/><text x="730" y="201" text-anchor="middle" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">doctor</text><circle cx="847" cy="238" r="8" fill="#2374a5"/><text x="847" y="222" text-anchor="middle" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">nurse</text><circle cx="986" cy="211" r="8" fill="#ef1c88"/><text x="986" y="195" text-anchor="middle" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">apple</text><circle cx="1088" cy="234" r="8" fill="#ef1c88"/><text x="1088" y="218" text-anchor="middle" fill="#0b1f33" font-family="Georgia,serif" font-size="16" font-weight="normal">banana</text><text x="682" y="277" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="15" font-weight="normal">Position is schematic, not a measured PCA plot.</text><path d="M52 307H1148" stroke="#d9e4eb" stroke-width="2"/><text x="52" y="343" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="21" font-weight="bold">2  Biased patterns in text can become associations in the vectors</text><text x="60" y="379" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="17" font-weight="normal">Repeated text patterns (toy)</text><text x="62" y="410" text-anchor="start" fill="#2374a5" font-family="Georgia,serif" font-size="20" font-weight="normal">&quot;he … engineer&quot;</text><text x="62" y="440" text-anchor="start" fill="#ef1c88" font-family="Georgia,serif" font-size="20" font-weight="normal">&quot;she … nurse&quot;</text><path d="M290 412 L387 412" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="410" y="379" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="17" font-weight="normal">Learned association</text><path d="M420 420 L756 420" fill="none" stroke="#a8c2d1" stroke-width="2" stroke-linecap="round"/><circle cx="458" cy="420" r="8" fill="#ef1c88"/><text x="458" y="451" text-anchor="middle" fill="#ef1c88" font-family="Georgia,serif" font-size="16" font-weight="normal">she</text><circle cx="523" cy="420" r="8" fill="#ef1c88"/><text x="523" y="451" text-anchor="middle" fill="#ef1c88" font-family="Georgia,serif" font-size="16" font-weight="normal">nurse</text><circle cx="665" cy="420" r="8" fill="#2374a5"/><text x="665" y="451" text-anchor="middle" fill="#2374a5" font-family="Georgia,serif" font-size="16" font-weight="normal">he</text><circle cx="721" cy="420" r="8" fill="#2374a5"/><text x="721" y="451" text-anchor="middle" fill="#2374a5" font-family="Georgia,serif" font-size="16" font-weight="normal">engineer</text><path d="M763 412 L823 412" fill="none" stroke="#2374a5" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="850" y="381" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="19" font-weight="bold">Possible bias</text><text x="850" y="414" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="17" font-weight="normal">A similarity score may echo</text><text x="850" y="441" text-anchor="start" fill="#0b1f33" font-family="Georgia,serif" font-size="17" font-weight="normal">a stereotype in the text.</text><text x="52" y="486" text-anchor="start" fill="#526777" font-family="Georgia,serif" font-size="16" font-weight="normal">The notebook tests this model&#x27;s associations; a word score does not describe anyone&#x27;s ability or suitability.</text></svg>