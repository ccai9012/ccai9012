<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 155" role="img" aria-label="Image-material analysis workflow with Step 3, ask vision models, highlighted."><style>text{font-family:Georgia,serif;fill:#0b1f33}.n{font-size:15px;font-weight:700}.s{font-size:13px;fill:#526777}.on{fill:#fff9fc;stroke:#ef1c88;stroke-width:3}.off{fill:#f5f9fb;stroke:#a8c2d1;stroke-width:1.5}.a{stroke:#2374a5;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2374a5"/></marker></defs><rect width="1200" height="155" fill="#fff"/><rect class="off" x="16" y="24" width="250" height="104" rx="16"/><text class="n" x="42" y="63">1. Design experiment</text><text class="s" x="42" y="89">neutral prompt + seeds</text><path class="a" d="M274 76H320"/><rect class="off" x="330" y="24" width="250" height="104" rx="16"/><text class="n" x="356" y="63">2. Generate images</text><text class="s" x="356" y="89">text → image set</text><path class="a" d="M588 76H634"/><rect class="on" x="644" y="24" width="250" height="104" rx="16"/><text class="n" x="670" y="63">3. Ask vision models</text><text class="s" x="670" y="89">image → text answers</text><path class="a" d="M902 76H948"/><rect class="off" x="958" y="24" width="226" height="104" rx="16"/><text class="n" x="984" y="63">4. View patterns</text><text class="s" x="984" y="89">labels → charts</text></svg>
