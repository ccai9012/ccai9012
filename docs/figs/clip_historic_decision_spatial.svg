<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Offline-first CLIP decision path and spatial evidence chain</title>
  <desc id="desc">A decision tree chooses a deterministic local sample or explicit Google Street View API mode. Both paths lead through a manifest to an image, CLIP similarity scores, and a mapped historic-index candidate.</desc>
  <defs>
    <style>
      .box{fill:#fff;stroke:#1f4e79;stroke-width:3;rx:14}.choice{fill:#eaf3fb;stroke:#1f4e79;stroke-width:3}.warn{fill:#fff7e6;stroke:#b36b00;stroke-width:3;rx:14}.out{fill:#eef8ee;stroke:#31723f;stroke-width:3;rx:14}.t{font:22px sans-serif;fill:#183247}.s{font:18px sans-serif;fill:#36586e}.a{stroke:#557b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#557b91"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fbfd"/>
  <text x="40" y="48" class="t" font-weight="700">Historic-area CLIP: choose the data path before running inference</text>
  <rect x="420" y="78" width="360" height="72" class="choice"/>
  <text x="600" y="108" text-anchor="middle" class="t">Which input mode?</text>
  <text x="600" y="134" text-anchor="middle" class="s">default: offline sample</text>
  <path d="M500 150 L260 215" class="a"/><path d="M700 150 L940 215" class="a dash"/>
  <rect x="65" y="215" width="390" height="100" class="box"/>
  <text x="260" y="247" text-anchor="middle" class="t">Local sample (default)</text>
  <text x="260" y="276" text-anchor="middle" class="s">deterministic subset of 582 tracked images</text>
  <text x="260" y="300" text-anchor="middle" class="s">no key · no network</text>
  <rect x="745" y="215" width="390" height="100" class="warn"/>
  <text x="940" y="247" text-anchor="middle" class="t">Google Street View API (opt-in)</text>
  <text x="940" y="276" text-anchor="middle" class="s">requires key, quota, and explicit request</text>
  <text x="940" y="300" text-anchor="middle" class="s">missing key → helpful stop before request</text>
  <path d="M260 315 L260 365 L600 365" class="a"/><path d="M940 315 L940 365 L600 365" class="a dash"/>
  <rect x="420" y="330" width="360" height="72" class="choice"/>
  <text x="600" y="360" text-anchor="middle" class="t">Coordinate/image manifest</text>
  <text x="600" y="386" text-anchor="middle" class="s">one validated join key per image</text>
  <path d="M600 402 L600 440" class="a"/>
  <rect x="40" y="440" width="250" height="78" class="out"/><text x="165" y="472" text-anchor="middle" class="t">image + point</text><text x="165" y="497" text-anchor="middle" class="s">lat · lon · heading</text>
  <path d="M290 479 L355 479" class="a"/>
  <rect x="355" y="440" width="250" height="78" class="out"/><text x="480" y="472" text-anchor="middle" class="t">CLIP similarity</text><text x="480" y="497" text-anchor="middle" class="s">image ↔ text prompts</text>
  <path d="M605 479 L670 479" class="a"/>
  <rect x="670" y="440" width="250" height="78" class="out"/><text x="795" y="472" text-anchor="middle" class="t">candidate index</text><text x="795" y="497" text-anchor="middle" class="s">weighted mapped score</text>
  <path d="M920 479 L985 479" class="a"/>
  <rect x="985" y="440" width="175" height="78" class="warn"/><text x="1072" y="472" text-anchor="middle" class="t">human check</text><text x="1072" y="497" text-anchor="middle" class="s">not ground truth</text>
</svg>
