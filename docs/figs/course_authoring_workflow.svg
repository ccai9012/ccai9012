<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How a Markdown course page becomes a published page</title>
  <desc id="desc">A five-stage workflow from authoring Markdown through pages.json registration, local build, visual checks, and GitHub Pages publication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1597d4"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#f8fbff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102a43">How does one Markdown page reach students?</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#486581">Keep source, navigation, generated HTML, and verification visible as one small release path.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(45 125)"><rect width="190" height="135" rx="12" fill="#ffffff" stroke="#1597d4" stroke-width="3"/><circle cx="28" cy="28" r="17" fill="#1597d4"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text><text x="95" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#102a43">Author</text><text x="95" y="65" text-anchor="middle" font-size="14" fill="#334e68">docs/md/page.md</text><text x="95" y="92" text-anchor="middle" font-size="13" fill="#627d98">Write short sections</text><text x="95" y="112" text-anchor="middle" font-size="13" fill="#627d98">and local asset links.</text></g>
    <path d="M245 192 H285" stroke="#1597d4" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(300 125)"><rect width="190" height="135" rx="12" fill="#ffffff" stroke="#1597d4" stroke-width="3"/><circle cx="28" cy="28" r="17" fill="#1597d4"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text><text x="95" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#102a43">Register</text><text x="95" y="65" text-anchor="middle" font-size="14" fill="#334e68">docs/pages.json</text><text x="95" y="92" text-anchor="middle" font-size="13" fill="#627d98">Set source, output,</text><text x="95" y="112" text-anchor="middle" font-size="13" fill="#627d98">and navigation label.</text></g>
    <path d="M500 192 H540" stroke="#1597d4" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(555 125)"><rect width="190" height="135" rx="12" fill="#fff8e6" stroke="#f08c46" stroke-width="3"/><circle cx="28" cy="28" r="17" fill="#f08c46"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text><text x="95" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#102a43">Build</text><text x="95" y="65" text-anchor="middle" font-size="14" fill="#334e68">python docs/md_to_html.py</text><text x="95" y="92" text-anchor="middle" font-size="13" fill="#627d98">Generate the mapped</text><text x="95" y="112" text-anchor="middle" font-size="13" fill="#627d98">HTML under docs/.</text></g>
    <path d="M755 192 H795" stroke="#1597d4" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(810 125)"><rect width="150" height="135" rx="12" fill="#ffffff" stroke="#1597d4" stroke-width="3"/><circle cx="28" cy="28" r="17" fill="#1597d4"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text><text x="75" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#102a43">Inspect</text><text x="75" y="65" text-anchor="middle" font-size="13" fill="#627d98">Links, images,</text><text x="75" y="86" text-anchor="middle" font-size="13" fill="#627d98">mobile layout,</text><text x="75" y="107" text-anchor="middle" font-size="13" fill="#627d98">sidebar and TOC.</text></g>
    <path d="M970 192 H1010" stroke="#1597d4" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1025 125)"><rect width="130" height="135" rx="12" fill="#f6efff" stroke="#b36bce" stroke-width="3"/><circle cx="28" cy="28" r="17" fill="#b36bce"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text><text x="65" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#102a43">Publish</text><text x="65" y="68" text-anchor="middle" font-size="13" fill="#627d98">Commit, push,</text><text x="65" y="89" text-anchor="middle" font-size="13" fill="#627d98">then verify</text><text x="65" y="110" text-anchor="middle" font-size="13" fill="#627d98">the public URL.</text></g>
  </g>
</svg>
