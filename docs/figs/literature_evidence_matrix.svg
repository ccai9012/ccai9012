<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 670" width="1490" height="670" role="img" aria-labelledby="title desc">
<title id="title">Literature review: from papers to a source-linked comparison</title><desc id="desc">Input is a collection of research PDFs plus a comparison question. Candidate passages retain document and page. An LLM extracts comparable fields. A table keeps claim, source passage, and uncertainty; the reader reopens the paper to verify.</desc><defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2374a5"/></marker>
<marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef1c88"/></marker>
<style>.title{font:700 29px Georgia,serif;fill:#0b1f33}.sub{font:16px Georgia,serif;fill:#526777}.h{font:700 19px Georgia,serif;fill:#0b1f33}.body{font:16px Georgia,serif;fill:#34495a}.tiny{font:14px Georgia,serif;fill:#526777}.white{font:700 18px Georgia,serif;fill:white}.mono{font:16px Menlo,monospace;fill:#0b1f33}.lane{fill:#fff9fc;stroke:#ef1c88;stroke-width:2.5;stroke-dasharray:9 7}.card{fill:white;stroke:#6e9ab4;stroke-width:1.6}.flow{fill:none;stroke:#2374a5;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr)}.feedback{fill:none;stroke:#ef1c88;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrPink)}</style></defs>
<rect width="1490" height="670" fill="white"/><text x="44" y="48" class="title">Literature review: from papers to a source-linked comparison</text><text x="44" y="76" class="sub">The question determines what evidence to look for; the model organises candidate passages for review.</text><rect x="34" y="104" width="1422" height="230" rx="22" class="lane"/><text x="61" y="143" class="h">Bring together the reading material and the question</text><g transform="translate(100 184) scale(1.1)"><rect x="14" y="9" width="55" height="76" rx="6" fill="#ef3e45"/><path d="M52 9v21h17" fill="#ffadb0"/><rect x="0" y="0" width="55" height="76" rx="6" fill="#d92637"/><path d="M37 0v21h18" fill="#ffadb0"/><text x="27" y="50" class="white" text-anchor="middle">PDF</text></g><g transform="translate(153 196) scale(0.83)"><rect x="14" y="9" width="55" height="76" rx="6" fill="#ef3e45"/><path d="M52 9v21h17" fill="#ffadb0"/><rect x="0" y="0" width="55" height="76" rx="6" fill="#d92637"/><path d="M37 0v21h18" fill="#ffadb0"/><text x="27" y="50" class="white" text-anchor="middle">PDF</text></g><text x="300" y="234" class="h">Research papers</text><text x="300" y="267" class="body">PDF text with document identity</text><text x="567" y="249" class="h">+</text><g transform="translate(649 184)"><circle cx="29" cy="22" r="19" fill="#ffd5e7" stroke="#ef1c88" stroke-width="2"/><path d="M2 74c5-24 50-24 55 0" fill="#ffd5e7" stroke="#ef1c88" stroke-width="2"/><rect x="72" y="13" width="129" height="61" rx="8" fill="white" stroke="#6e9ab4"/><path d="M84 34h105M84 51h77" stroke="#2374a5" stroke-width="2"/></g><text x="862" y="234" class="h">Comparison question</text><text x="862" y="267" class="body">Which methods or findings differ?</text><rect x="34" y="361" width="1422" height="237" rx="22" class="lane"/><text x="61" y="400" class="h">Keep a visible route back to each paper</text><g transform="translate(80 441) scale(1.0)"><circle cx="32" cy="32" r="27" fill="#e4f6fb" stroke="#00b5e2" stroke-width="3"/><path d="M53 53l25 25" stroke="#00b5e2" stroke-width="7" stroke-linecap="round"/></g><text x="169" y="483" class="h">Find passages</text><text x="169" y="514" class="tiny">paper + page</text><path d="M330 487H392" class="flow"/><g transform="translate(418 435) scale(1.05)"><rect width="116" height="88" rx="14" fill="#0b1f33"/><circle cx="39" cy="36" r="20" fill="#d9f2f9"/><circle cx="32" cy="34" r="3" fill="#0b1f33"/><circle cx="46" cy="34" r="3" fill="#0b1f33"/><path d="M29 47h20" stroke="#0b1f33" stroke-width="3"/><path d="M24 8l5-15 5 15m50 0 5-15 5 15" stroke="#00b5e2" stroke-width="3"/><rect x="67" y="25" width="35" height="10" rx="5" fill="#00b5e2"/><rect x="67" y="48" width="28" height="8" rx="4" fill="#b7ddec"/></g><text x="550" y="481" class="h">LLM organises</text><text x="550" y="512" class="tiny">comparable fields</text><path d="M674 487H746" class="flow"/><g transform="translate(767 441) scale(1.0)"><rect width="128" height="88" rx="8" fill="white" stroke="#6e9ab4" stroke-width="2"/><path d="M0 29h128M0 58h128M43 0v88M86 0v88" stroke="#6e9ab4" stroke-width="1.5"/><rect x="6" y="36" width="30" height="14" fill="#d9f2f9"/><rect x="50" y="66" width="29" height="13" fill="#ffd5e7"/></g><text x="910" y="482" class="h">Evidence notes</text><text x="910" y="513" class="tiny">field + claim + source</text><path d="M1094 487H1150" class="flow"/><g transform="translate(1170 439)"><rect width="81" height="84" rx="9" fill="white" stroke="#6e9ab4"/><path d="M18 24h45M18 38h45M18 52h26" stroke="#00b5e2" stroke-width="2"/><path d="M38 69l9 8 19-21" fill="none" stroke="#ef1c88" stroke-width="4"/></g><text x="1265" y="482" class="h">Verify</text><text x="1265" y="513" class="tiny">reopen the PDF</text><text x="62" y="638" class="body">A page is a candidate lookup location, not an automatic citation. Missing evidence stays uncertain.</text></svg>
