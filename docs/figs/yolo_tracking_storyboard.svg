<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">YOLO pedestrian frame-to-trajectory storyboard</title>
  <desc id="desc">Four panels show detection per frame, persistent track IDs, a trajectory table and heatmap, and a rendered output clip.</desc>
  <defs><style>.p{fill:#fff;stroke:#1f4e79;stroke-width:3;rx:14}.h{fill:#eaf3fb;stroke:#1f4e79;stroke-width:3;rx:14}.t{font:21px sans-serif;fill:#183247}.s{font:17px sans-serif;fill:#36586e}.a{stroke:#557b91;stroke-width:3;fill:none;marker-end:url(#arrow)}.person{fill:#ffd166;stroke:#9a6b00;stroke-width:2}.line{stroke:#2a9d8f;stroke-width:5;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#557b91"/></marker></defs>
  <rect width="1200" height="430" fill="#f8fbfd"/><text x="40" y="42" class="t" font-weight="700">YOLO11 + ByteTrack: from frame evidence to a bounded trajectory output</text>
  <rect x="35" y="80" width="260" height="260" class="p"/><text x="165" y="115" text-anchor="middle" class="t">1 · detection</text><rect x="65" y="140" width="200" height="150" fill="#dce9ef"/><rect x="105" y="175" width="34" height="72" class="person"/><rect x="183" y="190" width="34" height="70" class="person"/><text x="100" y="310" class="s">boxes + confidence</text>
  <path d="M295 210 L330 210" class="a"/>
  <rect x="330" y="80" width="260" height="260" class="p"/><text x="460" y="115" text-anchor="middle" class="t">2 · persistent IDs</text><rect x="360" y="140" width="200" height="150" fill="#dce9ef"/><rect x="405" y="175" width="34" height="72" class="person"/><rect x="475" y="190" width="34" height="70" class="person"/><text x="405" y="164" class="s">ID 3</text><text x="475" y="180" class="s">ID 8</text><text x="365" y="310" class="s">IoU association across frames</text>
  <path d="M590 210 L625 210" class="a"/>
  <rect x="625" y="80" width="260" height="260" class="p"/><text x="755" y="115" text-anchor="middle" class="t">3 · table + maps</text><path d="M660 245 C700 220 710 280 750 245 S820 205 855 180" class="line"/><text x="655" y="155" class="s">frame | id | x1…y2</text><text x="655" y="310" class="s">bottom-centre → trajectory/heatmap</text>
  <path d="M885 210 L920 210" class="a"/>
  <rect x="920" y="80" width="245" height="260" class="h"/><text x="1042" y="115" text-anchor="middle" class="t">4 · rendered clip</text><rect x="950" y="145" width="185" height="115" fill="#dce9ef"/><path d="M965 240 C1005 210 1030 250 1070 205 S1110 180 1120 165" class="line"/><text x="1042" y="290" text-anchor="middle" class="s">bounded output/video/</text><text x="1042" y="315" text-anchor="middle" class="s">not committed</text>
</svg>
