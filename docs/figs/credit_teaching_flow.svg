<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 760" width="1490" height="760" role="img" aria-labelledby="title desc">
<title id="title">Credit audit: performance and group gaps are different questions</title><desc id="desc">Credit records contain an outcome and age group. Original and reweighed training fit two models. Both use a shared test set. One output compares accuracy/AUC; a separate signed axis shows statistical parity and equal opportunity gaps, under-25 minus age-25-plus. Illustration contains no fixed result values.</desc><defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2374a5"/></marker>
<marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef1c88"/></marker>
<style>.title{font:700 29px Georgia,serif;fill:#0b1f33}.sub{font:16px Georgia,serif;fill:#526777}.h{font:700 19px Georgia,serif;fill:#0b1f33}.body{font:16px Georgia,serif;fill:#34495a}.tiny{font:14px Georgia,serif;fill:#526777}.white{font:700 18px Georgia,serif;fill:white}.mono{font:16px Menlo,monospace;fill:#0b1f33}.lane{fill:#fff9fc;stroke:#ef1c88;stroke-width:2.5;stroke-dasharray:9 7}.card{fill:white;stroke:#6e9ab4;stroke-width:1.6}.flow{fill:none;stroke:#2374a5;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr)}.feedback{fill:none;stroke:#ef1c88;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrPink)}</style></defs>
<rect width="1490" height="760" fill="white"/><text x="44" y="48" class="title">Credit audit: performance and group gaps are different questions</text><text x="44" y="76" class="sub">Reweighing changes training influence; both models are checked on the same untouched test records.</text><rect x="35" y="105" width="1420" height="214" rx="22" class="lane"/><text x="62" y="145" class="h">Start with records and define the groups</text><g transform="translate(100 176)"><circle cx="35" cy="25" r="23" fill="#d9f2f9" stroke="#6e9ab4"/><path d="M2 89c5-31 61-31 67 0" fill="#d9f2f9" stroke="#6e9ab4"/></g><text x="135" y="291" class="tiny" text-anchor="middle">under 25</text><g transform="translate(285 176)"><circle cx="35" cy="25" r="23" fill="#ffd5e7" stroke="#6e9ab4"/><path d="M2 89c5-31 61-31 67 0" fill="#ffd5e7" stroke="#6e9ab4"/></g><text x="320" y="291" class="tiny" text-anchor="middle">age 25+</text><text x="495" y="221" class="h">Good / bad credit outcome</text><text x="495" y="255" class="body">and other applicant features</text><path d="M841 229H923" class="flow"/><g transform="translate(961 165)"><path d="M70 7v120M8 40h126M20 40l-20 56h41L20 40zm101 0-20 56h41l-21-56zM41 127h58" fill="none" stroke="#2374a5" stroke-width="5"/><circle cx="70" cy="28" r="9" fill="#f5a623"/></g><text x="1210" y="220" class="h">Reweigh training</text><text x="1210" y="254" class="body">group × outcome</text><rect x="35" y="347" width="1420" height="190" rx="22" class="lane"/><text x="62" y="387" class="h">Fit two models, then use one common test set</text><rect x="77" y="412" width="435" height="86" rx="15" class="card"/><text x="295" y="447" class="h" text-anchor="middle">Original sample weights</text><text x="295" y="477" class="body" text-anchor="middle">Model A</text><rect x="547" y="412" width="435" height="86" rx="15" class="card"/><text x="765" y="447" class="h" text-anchor="middle">Adjusted sample weights</text><text x="765" y="477" class="body" text-anchor="middle">Model B</text><path d="M295 501V518H1032V455H1054" class="flow"/><path d="M994 455H1054" class="flow"/><rect x="1065" y="410" width="333" height="92" rx="15" class="card"/><text x="1231" y="447" class="h" text-anchor="middle">Same held-out records</text><text x="1231" y="478" class="body" text-anchor="middle">evaluate A and B</text><rect x="35" y="561" width="1420" height="155" rx="22" class="lane"/><text x="62" y="600" class="h">Read the two outputs separately</text><g transform="translate(93 622)"><path d="M0 61V2M0 61H161" stroke="#6e9ab4" stroke-width="2"/><rect x="29" y="20" width="39" height="41" fill="#00b5e2"/><rect x="90" y="31" width="39" height="30" fill="#2374a5"/></g><text x="285" y="658" class="h">Accuracy + AUC</text><text x="285" y="687" class="tiny">How well does it predict?</text><g transform="translate(794 622)"><path d="M84 0v65M9 65H162" stroke="#6e9ab4" stroke-width="2"/><rect x="37" y="17" width="47" height="15" fill="#ef1c88"/><rect x="54" y="43" width="30" height="15" fill="#f5a623"/><text x="77" y="-4" class="tiny">0</text></g><text x="1001" y="658" class="h">Signed fairness differences</text><text x="1001" y="687" class="tiny">Which group has the lower rate?</text><text x="62" y="744" class="body">Zero means equal rates for that metric. Negative = under-25 rate is lower; check the measured values in the notebook.</text></svg>
