<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 620" width="1490" height="620" role="img" aria-labelledby="title desc">
<title id="title">Urban sentiment: from a written review to cautious patterns</title><desc id="desc">A review has text, rating, and location. An LLM extracts polarity, emotion, and topics. A row keeps the source text beside those labels. Counts, keywords, and map points describe the selected reviews, not the entire city.</desc><defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2374a5"/></marker>
<marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef1c88"/></marker>
<style>.title{font:700 29px Georgia,serif;fill:#0b1f33}.sub{font:16px Georgia,serif;fill:#526777}.h{font:700 19px Georgia,serif;fill:#0b1f33}.body{font:16px Georgia,serif;fill:#34495a}.tiny{font:14px Georgia,serif;fill:#526777}.white{font:700 18px Georgia,serif;fill:white}.mono{font:16px Menlo,monospace;fill:#0b1f33}.lane{fill:#fff9fc;stroke:#ef1c88;stroke-width:2.5;stroke-dasharray:9 7}.card{fill:white;stroke:#6e9ab4;stroke-width:1.6}.flow{fill:none;stroke:#2374a5;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arr)}.feedback{fill:none;stroke:#ef1c88;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrPink)}</style></defs>
<rect width="1490" height="620" fill="white"/><text x="44" y="48" class="title">Urban sentiment: from a written review to cautious patterns</text><text x="44" y="76" class="sub">The model labels comments; readers keep the words behind each label before viewing aggregates.</text><rect x="34" y="110" width="1422" height="345" rx="22" class="lane"/><text x="61" y="149" class="h">Follow one review before combining many</text><g transform="translate(82 206)"><rect width="225" height="143" rx="14" fill="white" stroke="#6e9ab4" stroke-width="2"/><path d="M33 39h160M33 65h130M33 91h150" stroke="#00b5e2" stroke-width="4" stroke-linecap="round"/><path d="M73 143l-23 20v-20" fill="white" stroke="#6e9ab4" stroke-width="2"/><text x="28" y="128" class="tiny">★ ★ ★ ★ ☆</text></g><text x="195" y="397" class="h" text-anchor="middle">Review text + rating</text><text x="195" y="427" class="tiny" text-anchor="middle">with a business location</text><path d="M333 289H402" class="flow"/><g transform="translate(429 217) scale(1.48)"><rect width="116" height="88" rx="14" fill="#0b1f33"/><circle cx="39" cy="36" r="20" fill="#d9f2f9"/><circle cx="32" cy="34" r="3" fill="#0b1f33"/><circle cx="46" cy="34" r="3" fill="#0b1f33"/><path d="M29 47h20" stroke="#0b1f33" stroke-width="3"/><path d="M24 8l5-15 5 15m50 0 5-15 5 15" stroke="#00b5e2" stroke-width="3"/><rect x="67" y="25" width="35" height="10" rx="5" fill="#00b5e2"/><rect x="67" y="48" width="28" height="8" rx="4" fill="#b7ddec"/></g><text x="515" y="397" class="h" text-anchor="middle">LLM labels the text</text><text x="515" y="427" class="tiny" text-anchor="middle">polarity · emotion · topics</text><path d="M610 289H687" class="flow"/><rect x="711" y="212" width="304" height="159" rx="15" class="card"/><text x="735" y="247" class="h">Source-linked row</text><text x="735" y="279" class="body">original words</text><text x="735" y="310" class="body">rating + location</text><text x="735" y="341" class="body">model labels</text><path d="M1023 289H1090" class="flow"/><g transform="translate(1110 208)"><rect width="228" height="164" rx="12" fill="white" stroke="#6e9ab4"/><path d="M28 36h140M28 56h103" stroke="#00b5e2" stroke-width="3"/><circle cx="170" cy="110" r="27" fill="none" stroke="#ef1c88" stroke-width="4"/><path d="M190 130l25 26" stroke="#ef1c88" stroke-width="6"/></g><text x="1224" y="397" class="h" text-anchor="middle">Check the original</text><text x="1224" y="427" class="tiny" text-anchor="middle">does the label fit?</text><rect x="174" y="479" width="1142" height="88" rx="18" class="lane"/><text x="220" y="514" class="h">Then inspect the selected reviews together:</text><g transform="translate(687 495)"><path d="M0 47V20h16v27m12 0V6h16v41m12 0V28h16v19M-6 47h86" fill="none" stroke="#2374a5" stroke-width="4"/></g><text x="775" y="526" class="body">counts + keywords</text><g transform="translate(975 489)"><path d="M30 2c-15 0-26 11-26 26 0 20 26 49 26 49s26-29 26-49C56 13 45 2 30 2z" fill="#d9f2f9" stroke="#00b5e2" stroke-width="3"/><circle cx="30" cy="28" r="9" fill="white" stroke="#2374a5" stroke-width="2"/></g><text x="1060" y="526" class="body">sample map</text><text x="62" y="605" class="body">These are model labels for selected reviews; neither map colour nor word frequency estimates citywide opinion.</text></svg>
