<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Urban sentiment review scorecard</title>
  <desc id="desc">A sampled Yelp review enters a structured labeler. The raw text, star rating, generated polarity, emotion, and keywords are retained, then aggregated into a city scorecard with uncertainty.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#168aad"/></marker></defs>
  <rect width="1100" height="360" fill="#fbfdfe"/>
  <text x="40" y="38" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">From sampled reviews to a cautious city scorecard</text>
  <text x="40" y="65" font-family="Arial,sans-serif" font-size="15" fill="#4c6275">Retain raw text and ratings so model-generated labels remain inspectable.</text>
  <rect x="35" y="92" width="1030" height="225" rx="16" fill="#f5f9fb" stroke="#d5e5ec"/>
  <rect x="65" y="150" width="190" height="85" rx="10" fill="#eaf5f8" stroke="#168aad"/><text x="160" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d">Sampled Yelp review</text><text x="160" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">text + stars + location</text>
  <path d="M270 192 H335" stroke="#168aad" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="125" width="220" height="135" rx="10" fill="#fff7ed" stroke="#f28f3b"/><text x="460" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d">LLM or cached labels</text><text x="460" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">polarity + emotion</text><text x="460" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">keywords</text><text x="460" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">raw answer retained</text>
  <path d="M585 192 H650" stroke="#168aad" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="665" y="125" width="190" height="135" rx="10" fill="#dff3f8" stroke="#168aad"/><text x="760" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d">Scorecard</text><text x="760" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">label × star</text><text x="760" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">distribution</text><text x="760" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4c6275">map / sample size</text>
  <path d="M870 192 H925" stroke="#168aad" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="940" y="150" width="100" height="85" rx="10" fill="#fbeaf5" stroke="#b23a8a" stroke-dasharray="7 5"/><text x="990" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">Interpret</text><text x="990" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#4c6275">not population</text>
</svg>
